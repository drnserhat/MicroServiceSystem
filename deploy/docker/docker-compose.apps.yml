      Authentication__Jwt__RequireHttpsMetadata: "false"
      Persistence__Mongo__ConnectionString: mongodb://mongodb:27017
      Persistence__Mongo__DatabaseName: logging
      Messaging__RabbitMq__Host: rabbitmq
      Messaging__RabbitMq__UserName: msf
      Messaging__RabbitMq__Password: msf
      Logging__Framework__SeqServerUrl: http://seq
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Tabler admin SPA (nginx). API same-origin via nginx → gateway.
  # UI: http://localhost:5173
  admin:
    build:
      context: ../..
      dockerfile: apps/admin/Dockerfile
    ports:
      - "${ADMIN_HOST_PORT:-5173}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      gateway:
        condition: service_healthy
      settings:
        condition: service_healthy

volumes:
  file_data:
