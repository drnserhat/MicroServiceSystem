      Persistence__Postgres__ApplyMigrationsOnStartup: "true"
      Messaging__RabbitMq__Host: rabbitmq
      Messaging__RabbitMq__UserName: msf
      Messaging__RabbitMq__Password: msf
      Logging__Framework__SeqServerUrl: http://seq
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  settings:
    build:
      context: ../..
      dockerfile: src/Services/Settings/MicroServiceSystem.Services.Settings.Api/Dockerfile
    environment:
