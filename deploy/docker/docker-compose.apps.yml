    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  file:
    profiles: ["full"]
    build:
      context: ../..
      dockerfile: src/Services/File/MicroServiceSystem.Services.File.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Authentication__Jwt__Issuer: msf
      Authentication__Jwt__Audience: msf
      Authentication__Jwt__SigningKey: 0123456789abcdef0123456789abcdef01234567
      Authentication__Jwt__RequireHttpsMetadata: "false"
      Persistence__Postgres__ConnectionString: Host=postgres;Port=5432;Database=file;Username=msf;Password=msf
      Persistence__Postgres__ApplyMigrationsOnStartup: "true"
      Storage__Provider: Local
      Storage__Local__RootPath: /data/files
      Messaging__RabbitMq__Host: rabbitmq
      Messaging__RabbitMq__UserName: msf
      Messaging__RabbitMq__Password: msf
      Logging__Framework__SeqServerUrl: http://seq
    volumes:
      - file_data:/data/files
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy

  audit:
    profiles: ["full"]
    build:
      context: ../..
      dockerfile: src/Services/Audit/MicroServiceSystem.Services.Audit.Api/Dockerfile
    environment:
