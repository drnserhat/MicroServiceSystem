services:
  gateway:
    build:
      context: ../..
      dockerfile: src/Gateway/Gateway.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Authentication__Jwt__Issuer: msf
      Authentication__Jwt__Audience: msf
      Authentication__Jwt__SigningKey: 0123456789abcdef0123456789abcdef01234567
      Authentication__Jwt__RequireHttpsMetadata: "false"
      MultiTenancy__RequireTenant: "false"
      Cache__ConnectionString: redis:6379
      ReverseProxy__Clusters__identity__Destinations__d1__Address: http://identity:8080/
      ReverseProxy__Clusters__user__Destinations__d1__Address: http://user:8080/
      ReverseProxy__Clusters__coordinator__Destinations__d1__Address: http://coordinator:8080/
      ReverseProxy__Clusters__notification__Destinations__d1__Address: http://notification:8080/
      ReverseProxy__Clusters__file__Destinations__d1__Address: http://file:8080/
      ReverseProxy__Clusters__audit__Destinations__d1__Address: http://audit:8080/
      ReverseProxy__Clusters__settings__Destinations__d1__Address: http://settings:8080/
      ReverseProxy__Clusters__location__Destinations__d1__Address: http://location:8080/
      ReverseProxy__Clusters__logging__Destinations__d1__Address: http://logging:8080/
      Logging__Framework__SeqServerUrl: http://seq
      ServiceDefaults__Cors__AllowedOrigins__0: http://localhost:5173
      ServiceDefaults__Cors__AllowedOrigins__1: http://127.0.0.1:5173
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Lite default: wait for core path + settings (admin UI). Optional services use profile "full".
    depends_on:
      redis:
        condition: service_healthy
      identity:
        condition: service_healthy
      user:
        condition: service_healthy
      coordinator:
        condition: service_healthy
      settings:
        condition: service_healthy

  identity:
    build:
      context: ../..
      dockerfile: src/Services/Identity/MicroServiceSystem.Services.Identity.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Authentication__Jwt__Issuer: msf
      Authentication__Jwt__Audience: msf
      Authentication__Jwt__SigningKey: 0123456789abcdef0123456789abcdef01234567
      Authentication__Jwt__RequireHttpsMetadata: "false"
      Authentication__InternalService__Enabled: "true"
      Authentication__InternalService__ApiKey: dev-internal-api-key-change-me
      Persistence__Postgres__ConnectionString: Host=postgres;Port=5432;Database=identity;Username=msf;Password=msf
      Persistence__Postgres__AdminConnection: Host=postgres;Port=5432;Database=postgres;Username=msf;Password=msf
      Persistence__Postgres__AppPassword: msf
      Persistence__Postgres__ApplyMigrationsOnStartup: "true"
      Services__User__BaseUrl: http://user:8080/
      BranchDatabase__DefaultHost: postgres
      Cache__ConnectionString: redis:6379
      Messaging__RabbitMq__Host: rabbitmq
      Messaging__RabbitMq__UserName: msf
      Messaging__RabbitMq__Password: msf
      Logging__Framework__SeqServerUrl: http://seq
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  user:
    build:
      context: ../..
      dockerfile: src/Services/User/MicroServiceSystem.Services.User.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Authentication__Jwt__Issuer: msf
      Authentication__Jwt__Audience: msf
      Authentication__Jwt__SigningKey: 0123456789abcdef0123456789abcdef01234567
      Authentication__Jwt__RequireHttpsMetadata: "false"
      Authentication__InternalService__Enabled: "true"
      Authentication__InternalService__ApiKey: dev-internal-api-key-change-me
      Persistence__Postgres__ConnectionString: Host=postgres;Port=5432;Database=user;Username=msf;Password=msf
      Persistence__Postgres__Mode: TenantScoped
      Persistence__Postgres__ServiceKey: user
      Persistence__Postgres__AppPassword: msf
      Persistence__Postgres__ApplyMigrationsOnStartup: "true"
      Services__Identity__BaseUrl: http://identity:8080/
      Cache__ConnectionString: redis:6379
      Messaging__RabbitMq__Host: rabbitmq
      Messaging__RabbitMq__UserName: msf
      Messaging__RabbitMq__Password: msf
      Logging__Framework__SeqServerUrl: http://seq
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    depends_on:
      identity:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  coordinator:
    build:
      context: ../..
      dockerfile: src/Coordinator/Coordinator.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
