# Memory caps + globalization for local Docker Desktop.
# Always merge this file when running apps locally.
#
# Lite (default, ~3–4 GB):
#   docker compose -f deploy/docker/docker-compose.yml \
#     -f deploy/docker/docker-compose.apps.yml \
#     -f deploy/docker/docker-compose.resources.yml \
#     up -d --build
#
# Lite + admin SPA is now default (settings + nginx Tabler UI on :5173).
# Full stack (~8–12 GB):
#   ... --profile full up -d --build
#
# Observability only on top of lite:
#   ... --profile obs up -d

# The ASP.NET Core SDK turns Server GC on by default, which allocates a heap per core. Ten services
# doing that inside 384 MB caps on a multi core host is the single largest source of resident memory
# here, so the shared profile runs Workstation GC and only opts a service into Server GC when its
# throughput actually needs it (see x-dotnet-app-throughput).
x-dotnet-app: &dotnet-app
  mem_limit: 384m
  mem_reservation: 192m
  cpus: 1.0
  environment:
    DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "false"
    DOTNET_EnableDiagnostics: "0"
    DOTNET_gcServer: "0"
    DOTNET_gcConcurrent: "1"
    DOTNET_GCConserveMemory: "5"

# Server GC with a bounded heap count, for services that are actually throughput bound.
x-dotnet-app-throughput: &dotnet-app-throughput
  mem_limit: 768m
  mem_reservation: 384m
  cpus: 2.0
  environment:
    DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "false"
    DOTNET_EnableDiagnostics: "0"
    DOTNET_gcServer: "1"
    DOTNET_GCHeapCount: "2"
    DOTNET_gcConcurrent: "1"

services:
  postgres:
    mem_limit: 512m
    mem_reservation: 256m

  mongodb:
    mem_limit: 512m
    mem_reservation: 256m

  redis:
    mem_limit: 128m
    mem_reservation: 64m

  rabbitmq:
    mem_limit: 512m
    mem_reservation: 256m

  redisinsight:
    mem_limit: 256m
    mem_reservation: 128m

  pgadmin:
    mem_limit: 256m
    mem_reservation: 128m

  mongo-express:
    mem_limit: 128m
    mem_reservation: 64m

  seq:
    mem_limit: 512m
    mem_reservation: 256m

  jaeger:
    mem_limit: 512m
    mem_reservation: 256m

  prometheus:
    mem_limit: 256m
    mem_reservation: 128m

  grafana:
    mem_limit: 256m
    mem_reservation: 128m

  # Every external request passes through the gateway, so it is the one process worth the extra heap.
  gateway:
    <<: *dotnet-app-throughput

  identity:
    <<: *dotnet-app

  user:
    <<: *dotnet-app

  coordinator:
    <<: *dotnet-app

  notification:
    <<: *dotnet-app

  file:
    <<: *dotnet-app

  audit:
    <<: *dotnet-app

  settings:
    <<: *dotnet-app

  location:
    <<: *dotnet-app

  logging:
    <<: *dotnet-app

  admin:
    mem_limit: 64m
    mem_reservation: 32m
    cpus: 0.25
