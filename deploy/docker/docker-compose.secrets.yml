# Optional overlay: inject secrets from the environment / deploy/secrets/.env instead of the
# Development placeholders baked into docker-compose.apps.yml.
#
# Usage:
#   cp deploy/secrets/example.env deploy/secrets/.env
#   # edit .env
#   docker compose --env-file deploy/secrets/.env \
#     -f deploy/docker/docker-compose.yml \
#     -f deploy/docker/docker-compose.apps.yml \
#     -f deploy/docker/docker-compose.secrets.yml \
#     up -d
#
# Production: keep Api appsettings.json secrets empty and set these env vars from a vault /
# orchestrator secret store. Never commit deploy/secrets/.env.

services:
  identity:
    environment:
      Persistence__Postgres__ConnectionString: ${IDENTITY_CONNECTION_STRING}
      Persistence__Postgres__AdminConnection: ${POSTGRES_ADMIN_CONNECTION}
      Persistence__Postgres__AppPassword: ${POSTGRES_APP_PASSWORD}
      Persistence__Postgres__ApplyMigrationsOnStartup: "false"
      Services__User__BaseUrl: ${USER_SERVICE_BASE_URL:-http://user:8080/}
      BranchDatabase__DefaultHost: ${BRANCH_DATABASE_DEFAULT_HOST:-postgres}
      Authentication__Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Authentication__InternalService__ApiKey: ${INTERNAL_API_KEY}
      Messaging__RabbitMq__Host: ${RABBITMQ_HOST}
      Messaging__RabbitMq__UserName: ${RABBITMQ_USERNAME}
      Messaging__RabbitMq__Password: ${RABBITMQ_PASSWORD}
      Cache__ConnectionString: ${REDIS_CONNECTION}

  user:
    environment:
      Persistence__Postgres__ConnectionString: ${USER_CONNECTION_STRING}
      Persistence__Postgres__Mode: TenantScoped
      Persistence__Postgres__ServiceKey: user
      Persistence__Postgres__AppPassword: ${POSTGRES_APP_PASSWORD}
      Persistence__Postgres__ApplyMigrationsOnStartup: "false"
      Services__Identity__BaseUrl: ${IDENTITY_SERVICE_BASE_URL:-http://identity:8080/}
      Authentication__Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Authentication__InternalService__ApiKey: ${INTERNAL_API_KEY}
      Messaging__RabbitMq__Host: ${RABBITMQ_HOST}
      Messaging__RabbitMq__UserName: ${RABBITMQ_USERNAME}
      Messaging__RabbitMq__Password: ${RABBITMQ_PASSWORD}
      Cache__ConnectionString: ${REDIS_CONNECTION}

  coordinator:
    environment:
      Persistence__Postgres__ConnectionString: ${COORDINATOR_CONNECTION_STRING}
      Persistence__Postgres__ApplyMigrationsOnStartup: "false"
      Authentication__Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Authentication__InternalService__ApiKey: ${INTERNAL_API_KEY}
      Messaging__RabbitMq__Host: ${RABBITMQ_HOST}
      Messaging__RabbitMq__UserName: ${RABBITMQ_USERNAME}
      Messaging__RabbitMq__Password: ${RABBITMQ_PASSWORD}
      Cache__ConnectionString: ${REDIS_CONNECTION}

  audit:
    environment:
      Persistence__Postgres__ConnectionString: ${AUDIT_CONNECTION_STRING}
      Persistence__Postgres__ApplyMigrationsOnStartup: "false"
      Authentication__Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Messaging__RabbitMq__Host: ${RABBITMQ_HOST}
      Messaging__RabbitMq__UserName: ${RABBITMQ_USERNAME}
      Messaging__RabbitMq__Password: ${RABBITMQ_PASSWORD}

  file:
