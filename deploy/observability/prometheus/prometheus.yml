global:
  scrape_interval: 15s

# Every ASP.NET host exposes /metrics via BuildingBlocks.OpenTelemetry when
# Telemetry:PrometheusScrapingEnabled is true (the framework default).
scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["gateway:8080"]
    metrics_path: /metrics

  - job_name: identity
    static_configs:
      - targets: ["identity:8080"]
    metrics_path: /metrics

  - job_name: user
    static_configs:
      - targets: ["user:8080"]
    metrics_path: /metrics

  - job_name: coordinator
    static_configs:
      - targets: ["coordinator:8080"]
    metrics_path: /metrics

  - job_name: notification
    static_configs:
      - targets: ["notification:8080"]
    metrics_path: /metrics

  - job_name: file
    static_configs:
      - targets: ["file:8080"]
    metrics_path: /metrics

  - job_name: audit
    static_configs:
      - targets: ["audit:8080"]
    metrics_path: /metrics

  - job_name: settings
    static_configs:
      - targets: ["settings:8080"]
    metrics_path: /metrics

  - job_name: location
    static_configs:
      - targets: ["location:8080"]
    metrics_path: /metrics

  - job_name: logging
    static_configs:
      - targets: ["logging:8080"]
    metrics_path: /metrics
