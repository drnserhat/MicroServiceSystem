global:
  scrape_interval: 15s

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["gateway:8080"]
    metrics_path: /metrics

  - job_name: identity
    static_configs:
      - targets: ["identity:8080"]
    metrics_path: /metrics

  - job_name: user
    static_configs:
      - targets: ["user:8080"]
    metrics_path: /metrics

  - job_name: coordinator
    static_configs:
      - targets: ["coordinator:8080"]
    metrics_path: /metrics
