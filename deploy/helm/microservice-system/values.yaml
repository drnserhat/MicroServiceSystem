# GHCR images published by CI: ghcr.io/<owner>/msf-<name>:<tag>
image:
  registry: ghcr.io
  # Set to your GitHub org/user (CI uses github.repository_owner).
  repositoryOwner: REPLACE_ME
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
# - name: ghcr-pull

nameOverride: ""
fullnameOverride: ""

aspnetcoreEnvironment: Production

jwt:
  issuer: msf
  audience: msf
  requireHttpsMetadata: "false"

# External infrastructure (not deployed by this chart). Provide real endpoints before install.
infrastructure:
  redisConnection: redis:6379
  rabbitmq:
    host: rabbitmq
    username: msf
    # password comes from secrets below
  mongoConnectionString: mongodb://mongodb:27017

# Secrets — override via --set / --set-file / SealedSecrets / ExternalSecrets.
# Never commit production secrets. See values-production.example.yaml.
secrets:
  jwtSigningKey: "replace-with-at-least-32-random-bytes"
  internalApiKey: "replace-with-a-long-random-internal-api-key"
  rabbitmqPassword: "change-me"
  # Required when migrate.enabled=true (pre-install hook cannot read the chart Secret yet).
  migratePostgresPassword: ""
  connectionStrings:
    identity: "Host=postgres;Port=5432;Database=identity;Username=msf;Password=change-me"
    user: "Host=postgres;Port=5432;Database=user;Username=msf;Password=change-me"
    coordinator: "Host=postgres;Port=5432;Database=coordinator;Username=msf;Password=change-me"
    audit: "Host=postgres;Port=5432;Database=audit;Username=msf;Password=change-me"
    file: "Host=postgres;Port=5432;Database=file;Username=msf;Password=change-me"
    location: "Host=postgres;Port=5432;Database=location;Username=msf;Password=change-me"
    notification: "Host=postgres;Port=5432;Database=notification;Username=msf;Password=change-me"
    settings: "Host=postgres;Port=5432;Database=settings;Username=msf;Password=change-me"

# Apply schemas before / during install (apps never auto-migrate in Production).
migrate:
  enabled: false
  # Defaults to chart image tag of msf-migrate when empty.
  image: ""
  imagePullPolicy: IfNotPresent
  postgresHost: postgres
  postgresPort: "5432"
  postgresUser: msf
  # Prefer secrets.migratePostgresPassword; falls back to this for local experiments only.
  postgresPassword: ""
  hookWeight: "-5"

# Optional Ingress (nginx). When enabled, set gateway Service to ClusterIP (see values-production.example.yaml).
ingress:
  enabled: false
  className: nginx
  host: msf.example.local
  annotations: {}
  tls:
    enabled: false
    secretName: msf-tls
  apiPathPrefixes:
    - identity
    - settings
    - user
    - location
    - audit
    - logging
    - coordinator
    - registration
    - notification
    - file
    - ops

podDisruptionBudget:
  gateway:
    enabled: true
    minAvailable: 1

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Lite default: gateway + admin + identity + user + coordinator. Enable the rest for full stack.
apps:
  gateway:
    enabled: true
    replicas: 1
    service:
      type: LoadBalancer
      port: 80
    healthPath: /health/live
  admin:
    enabled: true
    replicas: 1
    service:
      port: 80
    healthPath: /
  identity:
    enabled: true
    replicas: 1
    database: identity
    healthPath: /health/ready
  user:
    enabled: true
    replicas: 1
    database: user
    healthPath: /health/ready
  coordinator:
    enabled: true
    replicas: 1
    database: coordinator
    healthPath: /health/ready
  notification:
    enabled: false
    replicas: 1
    database: notification
    healthPath: /health/ready
  file:
    enabled: false
    replicas: 1
    database: file
    healthPath: /health/ready
  audit:
    enabled: false
    replicas: 1
    database: audit
    healthPath: /health/ready
  settings:
    enabled: false
    replicas: 1
    database: settings
    healthPath: /health/ready
  location:
    enabled: false
    replicas: 1
    database: location
    healthPath: /health/ready
  logging:
    enabled: false
    replicas: 1
    # Mongo-backed; no Postgres connection string
    healthPath: /health/ready
