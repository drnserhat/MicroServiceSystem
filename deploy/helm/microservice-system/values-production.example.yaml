# Example production overrides — copy and fill; do not commit real secrets.
#   cp values-production.example.yaml values-production.local.yaml
#   ../scripts/validate-prod-values.sh values-production.local.yaml
#   helm upgrade --install msf . -n msf --create-namespace -f values-production.local.yaml
#
# Refuse to install until validate-prod-values exits 0.

image:
  repositoryOwner: REQUIRED_GHCR_OWNER
  # Prefer CI git SHA — never "latest" in production.
  tag: REQUIRED_IMAGE_TAG
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull

aspnetcoreEnvironment: Production

jwt:
  issuer: msf
  audience: msf
  requireHttpsMetadata: "true"

infrastructure:
  redisConnection: REQUIRED_REDIS_HOST:6379
  rabbitmq:
    host: REQUIRED_RABBITMQ_HOST
    username: msf
  mongoConnectionString: mongodb://REQUIRED_MONGO_HOST:27017

secrets:
  jwtSigningKey: REQUIRED_JWT_SIGNING_KEY_32_PLUS_CHARS_MINIMUM_LENGTH_OK
  internalApiKey: REQUIRED_INTERNAL_API_KEY
  rabbitmqPassword: REQUIRED_RABBITMQ_PASSWORD
  connectionStrings:
    identity: "Host=REQUIRED_PG;Port=5432;Database=identity;Username=msf;Password=REQUIRED"
    user: "Host=REQUIRED_PG;Port=5432;Database=user;Username=msf;Password=REQUIRED"
    coordinator: "Host=REQUIRED_PG;Port=5432;Database=coordinator;Username=msf;Password=REQUIRED"
    audit: "Host=REQUIRED_PG;Port=5432;Database=audit;Username=msf;Password=REQUIRED"
    file: "Host=REQUIRED_PG;Port=5432;Database=file;Username=msf;Password=REQUIRED"
    location: "Host=REQUIRED_PG;Port=5432;Database=location;Username=msf;Password=REQUIRED"
    notification: "Host=REQUIRED_PG;Port=5432;Database=notification;Username=msf;Password=REQUIRED"
    settings: "Host=REQUIRED_PG;Port=5432;Database=settings;Username=msf;Password=REQUIRED"
  # Used by migrate Job when migrate.enabled=true
  migratePostgresPassword: REQUIRED_PG_PASSWORD

migrate:
  enabled: true
  postgresHost: REQUIRED_PG
  postgresPort: "5432"
  postgresUser: msf

ingress:
  enabled: true
  className: nginx
  host: admin.example.com
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  tls:
    enabled: true
    secretName: msf-tls

podDisruptionBudget:
  gateway:
    enabled: true
    minAvailable: 1

# Production lite: HA on the control-plane path. Apps never auto-migrate (templates force false).
apps:
  gateway:
    enabled: true
    replicas: 2
    service:
      type: ClusterIP
      port: 80
  admin:
    enabled: true
    replicas: 2
  identity:
    enabled: true
    replicas: 2
  user:
    enabled: true
    replicas: 2
  coordinator:
    enabled: true
    replicas: 2
  settings:
    enabled: true
    replicas: 2
  # Full profile — enable when those services are provisioned:
  # location.enabled: true
  # audit.enabled: true
  # notification.enabled: true
  # file.enabled: true
  # logging.enabled: true
