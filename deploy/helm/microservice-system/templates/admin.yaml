{{- if .Values.apps.admin.enabled }}
{{- $gatewaySvc := include "msf.serviceName" (dict "root" . "name" "gateway") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "msf.serviceName" (dict "root" . "name" "admin") }}-nginx
  labels:
    {{- include "msf.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # SPA + gateway API on same origin (mirrors apps/admin/nginx.conf).
        location ~ ^/(identity|settings|user|location|audit|logging|coordinator|registration|notification|file|ops)/ {
            proxy_pass http://{{ $gatewaySvc }}:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Tenant-Id $http_x_tenant_id;
            client_max_body_size 12m;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "msf.serviceName" (dict "root" . "name" "admin") }}
  labels:
    {{- include "msf.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
spec:
  replicas: {{ .Values.apps.admin.replicas }}
  selector:
    matchLabels:
      {{- include "msf.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: admin
  template:
    metadata:
      labels:
        {{- include "msf.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: admin
      annotations:
        checksum/gateway-upstream: {{ $gatewaySvc | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: admin
          image: {{ include "msf.image" (dict "Values" .Values "name" "admin") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: {{ .Values.apps.admin.healthPath }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ .Values.apps.admin.healthPath }}
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "msf.serviceName" (dict "root" . "name" "admin") }}-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "msf.serviceName" (dict "root" . "name" "admin") }}
  labels:
    {{- include "msf.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
spec:
  type: ClusterIP
  selector:
    {{- include "msf.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: admin
  ports:
    - name: http
      port: {{ .Values.apps.admin.service.port }}
      targetPort: http
{{- end }}
