{{- if .Values.migrate.enabled }}
{{- $migrateImage := .Values.migrate.image | default (printf "%s/%s/msf-migrate:%s" .Values.image.registry .Values.image.repositoryOwner .Values.image.tag) }}
{{- $pgPassword := .Values.secrets.migratePostgresPassword | default .Values.migrate.postgresPassword }}
{{- if not $pgPassword }}
{{- fail "migrate.enabled requires secrets.migratePostgresPassword (or migrate.postgresPassword)" }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "msf.fullname" . }}-migrate
  labels:
    {{- include "msf.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    # Runs before Deployments so schemas exist; password comes from values (Secret is not yet available to pre-install hooks).
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": {{ .Values.migrate.hookWeight | quote }}
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        {{- include "msf.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ $migrateImage | quote }}
          imagePullPolicy: {{ .Values.migrate.imagePullPolicy }}
          workingDir: /src
          command: ["/bin/bash", "deploy/migrate/migrate-all.sh"]
          env:
            - name: POSTGRES_HOST
              value: {{ .Values.migrate.postgresHost | quote }}
            - name: POSTGRES_PORT
              value: {{ .Values.migrate.postgresPort | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.migrate.postgresUser | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ $pgPassword | quote }}
{{- end }}
